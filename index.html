<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elden Ring – Klangperlen Guide</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<!-- FRONT PAGE OVERLAY -->
<div id="frontpage">
    <img src="img/eldenring.jpg" id="front-logo" alt="Elden Ring Logo">
    <button id="enter-btn">Enter the Lands Between</button>
</div>

<!-- SEITEN-INHALT, DER MIT DEM MENÜ MITSCHIEBT -->
<div id="app">
    <!-- HEADER -->
    <header id="header">
        <div id="headerTitle">Elden Ring Guide</div>
        <button id="menuToggle" class="burger">☰</button>
    </header>

    <!-- CONTENT -->
    <main id="content">
    </main>
</div>

<!-- SEITLICHES MENÜ -->
<nav id="sideMenu">
    <br/>
    <br/>
    <ul class="menu">

        <li class="menu-item">
            <button class="menu-header">Klangperlen – Schmiedesteine</button>
            <ul class="submenu" data-source="data/smithing.json"></ul>
        </li>

        <li class="menu-item">
            <button class="menu-header">Klangperlen – Dunkelschmiedesteine</button>
            <ul class="submenu" data-source="data/somber.json"></ul>
        </li>
        <li class="menu-item">
            <button class="menu-header" id="map3dBtn">3D Karte – Lands Between</button>
        </li>

        <li class="menu-item">
            <button class="menu-header external-link"
                data-url="https://mapgenie.io/elden-ring/maps/the-lands-between">
                Interaktive Karte (Mapgenie)
            </button>
        </li>

    </ul>
</nav>

<script src="menu.js"></script>
<script src="app.js"></script>
<script type="module" src="map.js"></script>
</body>
</html>
